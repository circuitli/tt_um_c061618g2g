name: macros

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'src/*/**'
      - 'openlane/*/*.*'
      - 'info.yaml'
      - '.github/workflows/macros.yaml'

  workflow_dispatch:

# =========================================================================
# CONCURRENCY MANAGER (Cancels excessive outdated runs)
# =========================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # STEP 1: Independent job to build your macro abstracts
  macros:
    #if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 1. Pull down the structure completely
          submodules: recursive
          # 2. Tell Git to aggressively pull the cutting-edge remote branch files
          submodules-remote: true
          # 3. Pull the entire Git history so no shallow tracking blocks updates
          fetch-depth: 0
          # 4. Prevent stale build snapshots from sticking around
          clean: true 

       # Step 2: Query the workspace filesystem to verify if the Makefile exists
      - name: Check for Makefile presence
        id: check_makefile
        run: |
          if [ -f "Makefile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

     # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install and Run PDK Downloader Directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Install ciel (the open-source PDK version manager)
          python3 -m pip install ciel
          
          # 2. Automatically retrieve the latest available version hash from the PDK
          # This extracts the latest commit tracking string dynamically
          LATEST_HASH=$(python3 -m ciel ls-remote --pdk-family gf180mcu | head -n 1 | awk '{print $1}')
          echo "Activating PDK Version Hash: $LATEST_HASH"
          
          # 3. Instruct ciel to pull down and enable the target build using that hash
          python3 -m ciel enable --pdk-family gf180mcu "$LATEST_HASH"
          
          # 4. Create the flat path layout required by your simulations
          mkdir -p /home/runner/pdk
          
          # 5. Locate where ciel placed the versioned directory assets and symlink it
          CIEL_DIR=$(find /home/runner/ -type d -name "gf180mcu" -path "*/versions/*" | head -n 1)
          ln -s "$CIEL_DIR" /home/runner/pdk/gf180mcu
          
          # 6. Export environment variables to expose paths to subsequent tools
          echo "PDK_ROOT=/home/runner/pdk" >> $GITHUB_ENV
          echo "PDK=gf180mcuD" >> $GITHUB_ENV

      # Hardens the macros sub-config natively
      - name: 🔨 Compile Internal Hard Macros Natively
        if: steps.check_makefile.outputs.exists == 'true'
        shell: bash
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          PDK_TARGET: gf180mcuD
        run: |
          set -eo pipefail
          echo "🚀 Native macro hardening..."

          # Execute make exactly once and record the numeric status code
          make
          make_exit_code=$?
          make ensure
        
          # Re-enable standard safe exit constraints
          set -e
        
          echo "🔍 Evaluating tool execution status... (Code: $make_exit_code)"
        
          if [ $make_exit_code -ne 0 ]; then
            echo "❌ ERROR: The hardening step returned a non-zero exit status!"
            exit $make_exit_code
          fi
        
          echo "🎉 Macro compilation passed validation checks completely!"

      - name: Print LVS Log Directly to Terminal
        if: failure()
        run: |
          echo "=== DUMPING NETGEN REPORT COMPARISON ==="
          find . -name "lvs.netgen.rpt" -exec echo "--- FILE: {} ---" \; -exec tail -n 120 {} \;

          echo "=== DUMPING NETGEN LVS COMPARISON ==="
          find . -name "netgen-lvs.log" -exec echo "--- FILE: {} ---" \; -exec tail -n 120 {} \;

          echo "=== SEARCHING FOR MAGIC DRC LOGS ==="
          find . -name "*.magic.drc" -exec echo "--- FILE: {} ---" \; -exec head -n 50 {} \;

      - name: Upload LVS & DRC Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-signoff-logs
          path: |
            **/runs/*/*
          if-no-files-found: ignore

      - name: 💾 Upload Macro Abstract Views for Top-Level Assembly
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-macros
          path: macros/
          if-no-files-found: ignore
